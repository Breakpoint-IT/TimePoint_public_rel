services:
  timepoint:
    build:
      context: .
    container_name: timepoint-demo
    depends_on:
      - timepoint-demo-db
    environment:
      TIMEPOINT_CONFIG_PATH: /var/www/html/runtime/config.local.php
      TIMEPOINT_SQLITE_SOURCE: /var/www/html/legacy-db/timetracking.sqlite
      TIMEPOINT_DB_DRIVER: pgsql
      TIMEPOINT_DB_HOST: timepoint-demo-db
      TIMEPOINT_DB_PORT: 5432
      TIMEPOINT_DB_NAME: timepoint_demo
      TIMEPOINT_DB_USER: timepoint_demo
      TIMEPOINT_DB_PASSWORD: timepoint-demo-db-password
      TIMEPOINT_DEMO_MODE: "1"
      TIMEPOINT_DEMO_ADMIN_USERNAME: admin
      TIMEPOINT_DEMO_ADMIN_PASSWORD: timepoint-demo-admin
      TIMEPOINT_DEMO_ADMIN_EMAIL: demo-admin@example.com
    ports:
      - "8080:80"
    volumes:
      - timepoint_demo_runtime:/var/www/html/runtime
      - ./assets/db:/var/www/html/legacy-db:ro
    restart: unless-stopped

  timepoint-demo-db:
    image: postgres:16-alpine
    container_name: timepoint-demo-db
    environment:
      POSTGRES_DB: timepoint_demo
      POSTGRES_USER: timepoint_demo
      POSTGRES_PASSWORD: timepoint-demo-db-password
    volumes:
      - timepoint_demo_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  timepoint_demo_runtime:
  timepoint_demo_postgres_data:
